# Provisional Group Split-LBI profiles. Retune and freeze before formal reporting.
schema_version: 1
protocol_revision: transformer_group_lbi_otta_20260824_v2
formal_seed: 2026
method: shot
variant: group_lbi

model:
  name: deit_small_patch16_224.fb_in1k
  checkpoint_root: /home/nas3/biod/wangkangyi/checkpoints/source_models

data:
  list_root: /home/nas3/biod/wangkangyi/datasets/image_lists
  office31:
    batch_size: 64
    fo_batch_size: 64
    workers: 4
    num_classes: 31
  visda-c:
    batch_size: 256
    fo_batch_size: 256
    workers: 4
    num_classes: 12
  preprocessing:
    resize_size: 256
    crop_size: 224
    interpolation: bilinear
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    online_random_crop: true
    online_random_horizontal_flip: true
    fo_center_crop: true
  stream:
    order: fixed_random_permutation
    one_pass: true
    drop_last: false

adaptation:
  update_scope: last_three_blocks_qkv_proj_mlp_weights
  candidate_blocks: [9, 10, 11]
  candidate_suffixes:
    - attn.qkv.weight
    - attn.proj.weight
    - mlp.fc1.weight
    - mlp.fc2.weight
  candidate_tensor_count: 12
  candidate_scalar_count: 5308416
  model_mode: eval
  steps_per_online_batch: 1

selection:
  type: group_split_lbi
  group_order: block_then_qk_vo_ffn_then_coordinate
  total_groups: 6912
  group_size: 768
  budgets: [0.0005, 0.001, 0.002]
  integer_rule: floor
  integer_budgets: [3, 6, 13]
  support_measure: gamma_group_l2_div_sqrt_group_size
  strict_rollback: true
  topk_trim: false
  budget_slack: false
  state_lifecycle: theta_delta_gamma_z_reset_every_online_batch
  stage2_initialization: base_plus_masked_delta

# Retained only so the shared candidate-dense validator confirms the frozen
# controlled-Transformer optimizer family. Group-LBI Stage 2 resolves its LR
# from the dataset/budget profile below.
optimization:
  optimizer: adamw
  lr: 1.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01

stage2_optimization:
  optimizer: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  steps: 1
  lr_schedule: none
  strict_off_mask_value_freezing: true
  clear_off_mask_coordinate_state: [exp_avg, exp_avg_sq]

loss:
  components: [ent, div, pseudo]
  cls_par: 0.3
  ent_par: 1.0
  threshold: 0.0

runtime:
  deterministic: true
  amp: false
  pin_memory: true

checkpointing:
  enabled_by_default: true
  granularity: completed_online_batch
  save_adapted_model: false

diagnostics:
  delta_nonzero_tolerance: 1.0e-12
  progress_refresh_steps: 25

lbi_profiles:
  office31:
    "0.0005": &provisional
      status: provisional_default
      parameters:
        alpha: 0.1
        kappa: 1.0
        nu: 1.0
        omega: 0.1
        prox_lambda: 1.0
        tau_g: 1.0e-4
        stage1_max_steps: 3000
        stage2_lr: 1.0e-5
    default: *provisional
    "0.001": *provisional
    "0.002": *provisional
  visda-c:
    default: *provisional
    "0.0005": *provisional
    "0.001": *provisional
    "0.002": *provisional

output:
  root: /home/nas3/biod/wangkangyi/results/transformer_otta_group_lbi
