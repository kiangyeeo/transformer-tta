method: shot
task: otta

datasets:
  office:
    transfers:
      - [0, 1]

seeds:
  - 2020

variants:
  module_lbi:
    budgets:
      - 0.001
    lbi:
      alpha: 0.1
      kappa: 1.0
      nu: 1.0
      omega: 0.1
      stage1_max_steps: 3000
      budget_tolerance: 0.0001
      stage2_lr: 0.01
      stage2_steps: 1
      delta_nonzero_tolerance: 1.0e-12

common_training:
  batch_size: 64
  workers: 4
  gpu_id: "0"
  save_model: false

output_root: runs
