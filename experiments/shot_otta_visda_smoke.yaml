method: shot
task: otta
datasets:
  VISDA-C:
    transfers: [[0, 1]]
seeds: [2020]
output_root: runs
common_training:
  batch_size: 256
  workers: 4
  gpu_id: "0"
  save_model: false
variants:
  source_only: {}
  full_dense: {}
  module_dense: {}
  module_random:
    budgets: [0.001]
    selection_seed_mode: same_as_run_seed
    num_random_masks: 3
  module_magnitude:
    budgets: [0.001]
  module_saliency:
    budgets: [0.001]
  module_lbi:
    budgets: [0.001]
    lbi:
      alpha: 0.1
      kappa: 1.0
      nu: 1.0
      omega: 0.1
      stage1_max_steps: 3000
      budget_tolerance: 0.0001
      stage2_lr: 0.01
      stage2_steps: 1
      delta_nonzero_tolerance: 1.0e-12
