# Source-training v1 for all three Office-31 source domains.
# Use --source-domain amazon|dslr|webcam. The placeholder keeps the checkpoint
# paths aligned with AGENTS.md without maintaining three divergent files.
schema_version: 1

data:
  dataset: office31
  source_domain: amazon
  num_classes: 31
  source_list: /home/nas3/biod/wangkangyi/datasets/image_lists/office31/{source_domain}_list.txt
  class_mapping_path: /home/nas3/biod/wangkangyi/datasets/image_lists/office31/class_to_idx.json
  split:
    strategy: stratified_fixed
    validation_fraction: 0.1
    seed: 2026

model:
  name: deit_small_patch16_224.fb_in1k
  hidden_dim: 384
  head: linear
  pretrained_num_classes: 1000
  pretrained_path: /home/nas3/biod/wangkangyi/checkpoints/deit_small_patch16_224.fb_in1k/model.safetensors
  pretrained_config_path: /home/nas3/biod/wangkangyi/checkpoints/deit_small_patch16_224.fb_in1k/config.json
  head_init_std: 0.02
  drop_rate: 0.0
  drop_path_rate: 0.0

preprocessing:
  resize_size: 256
  crop_size: 224
  interpolation: bicubic
  horizontal_flip_probability: 0.5
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  strong_augmentation: disabled

training:
  # Full fine-tuning is the source model.  head-only would be a linear-probe
  # ablation and is deliberately rejected by config validation.
  finetune_scope: full_model
  epochs: 100
  batch_size: 64
  workers: 8
  seed: 2026
  label_smoothing: 0.1
  amp: true
  gradient_clipping: null
  model_ema: false
  optimizer:
    name: adamw
    # DeiT 5e-4 reference LR scaled from global batch 512 to 64.
    backbone_lr: 0.0000625
    # The newly initialized 31-way head uses the SHOT-style 10x LR ratio.
    head_lr: 0.000625
    weight_decay: 0.05
    betas: [0.9, 0.999]
    eps: 0.00000001
    no_decay_policy: bias_norm_and_tokens
  scheduler:
    name: cosine
    warmup_epochs: 5
    min_lr: 0.000001

checkpoint:
  output_path: /home/nas3/biod/wangkangyi/checkpoints/source_models/office31/{source_domain}.pth
  selection_metric: overall_accuracy
  save_last_each_epoch: true

runtime:
  device: cuda
  deterministic: true
  pin_memory: true
