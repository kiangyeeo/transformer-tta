method: shot
variant: full_dense
task: otta
seed: 2020
requested_budget: 0.1
selection_seed: 2020  # only used by module_random; saliency records null
num_random_masks: 3  # only used by module_random

device:
  gpu_id: "0"

data:
  dataset: office
  root: /path/to/dataset-root
  source: 0
  target: 1
  da: uda
  batch_size: 64
  workers: 4

model:
  backbone: resnet50
  bottleneck_dim: 256
  bottleneck_type: bn
  classifier_type: wn

source_checkpoint:
  root: /path/to/source-checkpoints

optimization:
  optimizer: sgd
  lr: 0.01
  lr_decay1: 0.1
  lr_decay2: 1.0
  momentum: 0.9
  weight_decay: 0.001
  nesterov: true
  lr_gamma: 10.0
  lr_power: 0.75

loss:
  components:
    - ent
    - div
    - pseudo
  cls_par: 0.3
  ent_par: 1.0
  threshold: 0.0

# Fixed-hyperparameter, one-budget Split-LBI settings for module_lbi.
# Dense Stage-2 initialization, accumulation Stage 3, the element prox
# threshold, and the local SGD semantics are intentionally not switchable.
lbi:
  alpha: 0.1
  kappa: 1.0
  nu: 1.0
  omega: 0.1
  stage1_max_steps: 3000
  budget_tolerance: 0.0001
  stage2_lr: 0.01
  stage2_steps: 1
  delta_nonzero_tolerance: 1.0e-12

output:
  root: runs
  run_name: null
  save_model: true
